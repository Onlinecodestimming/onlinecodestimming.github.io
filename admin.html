<div id="trackEditModal" class="modal hidden">
  <div class="modal-card">
    <h3>Edit Track</h3>
    <label>Title <input id="teTitle" /></label>
    <label>Artist <input id="teArtist" /></label>
    <label>Album <input id="teAlbum" /></label>
    <label>Genre <input id="teGenre" placeholder="e.g., Pop, Hip-Hop, Electronic" /></label>
    <label>Artwork URL (required) <input id="teArtwork" required /></label>
    <div class="modal-actions">
      <button id="teCancel" class="btn-secondary">Cancel</button>
      <button id="teSave" class="btn-primary">Save</button>
    </div>
  </div>
</div>
