<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Musicfy Admin</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.admin-card {

    width:420px;
    padding:35px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);

    border-radius:24px;

}

.admin-card input,
.admin-card button {

    width:100%;
    margin-top:12px;

    padding:14px;

    border-radius:14px;

    border:none;

    font-size:15px;

}


.admin-card button {

    background:white;
    cursor:pointer;

}


</style>

</head>


<body>


<div class="admin-card">


<h1>
Musicfy Admin
</h1>


<p>
Upload tracks
</p>



<input
id="adminKey"
type="password"
placeholder="Admin Key"
>


<input
id="files"
type="file"
accept="audio/*,video/*"
multiple
>


<input
id="artist"
placeholder="Artist"
>


<input
id="album"
placeholder="Album"
>


<input
id="artwork"
placeholder="Artwork URL"
>



<button id="upload">

Upload

</button>


<p id="status"></p>


</div>



<script src="admin.js"></script>


</body>

</html>
