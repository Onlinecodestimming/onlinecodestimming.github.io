<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fa2d55"><title>Musicfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="glow"></div>
  <div class="app">
    <aside class="sidebar"><a class="brand" href="#home"><b>♪</b>Musicfy</a>
      <nav><button class="nav active" data-page="home">⌂ <span>Home</span></button><button class="nav" data-page="library">♫ <span>Library</span></button><button class="nav" data-page="albums">▣ <span>Albums</span></button><button class="nav" data-page="artists">◎ <span>Artists</span></button><button class="nav" data-page="favorites">♥ <span>Favorites</span></button></nav>
    </aside>
    <main><header><label>⌕ <input id="search" type="search" placeholder="Search songs, artists, or albums"></label></header>
      <section id="home" class="page active"><p class="eyebrow">MUSICFY</p><h1>Good evening</h1><article class="hero"><p class="eyebrow">PICKED FOR YOU</p><h2 id="heroTitle">Your next favorite</h2><p id="heroArtist">Loading your library…</p><button id="heroPlay" class="play">▶ Play</button></article><h2>Recently added</h2><div id="recentRow" class="grid"></div><h2>Made for you</h2><div id="recommendationRow" class="grid"></div><h2>Albums</h2><div id="albumRow" class="grid"></div><h2>Artists</h2><div id="artistRow" class="grid artists"></div></section>
      <section id="library" class="page"><p class="eyebrow">YOUR COLLECTION</p><h1>Library</h1><div id="libraryList" class="list"></div></section>
      <section id="albums" class="page"><p class="eyebrow">BROWSE</p><h1>Albums</h1><div id="albumsPage" class="grid"></div></section>
      <section id="artists" class="page"><p class="eyebrow">BROWSE</p><h1>Artists</h1><div id="artistsPage" class="grid artists"></div></section>
      <section id="favorites" class="page"><p class="eyebrow">YOUR PICKS</p><h1>Favorites</h1><div id="favoritesList" class="list"></div></section>
      <section id="detail" class="page"><p id="detailEyebrow" class="eyebrow">MUSICFY</p><h1 id="detailTitle">Collection</h1><div id="detailList" class="list"></div></section>
    </main>
  </div>
  <footer class="player"><img id="playerArt" alt="" hidden><div class="song"><strong id="songTitle">Nothing playing</strong><span id="songArtist">Choose a song to begin</span></div><div class="center"><div class="controls"><button id="previous" aria-label="Previous">⏮</button><button id="play" class="main" aria-label="Play">▶</button><button id="next" aria-label="Next">⏭</button></div><div class="progress"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><button id="favorite" class="heart" aria-label="Favorite">♡</button><audio id="audio" preload="metadata"></audio></footer>
  <script src="frontend.js"></script>
</body></html>
