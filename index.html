<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Stream</title>
<style>
    :root {
        --bg-color: #ffffff;
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
        --border-color: #d2d2d7;
        --hover-bg: #f5f5f7;
        --accent: #fa243c; 
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 20px 40px;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
    }

    .header-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .header {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .tabs {
        display: flex;
        gap: 15px;
    }

    .tab {
        cursor: pointer;
        font-weight: 600;
        color: var(--text-secondary);
    }
    
    .tab.active {
        color: var(--accent);
    }

    .song-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .song-item {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 8px;
        transition: background 0.2s ease;
        border-bottom: 1px solid #f0f0f0;
    }

    .song-item:hover {
        background-color: var(--hover-bg);
        cursor: pointer;
    }

    .album-art {
        width: 48px;
        height: 48px;
        border-radius: 6px;
        background-color: var(--border-color);
        margin-right: 16px;
        object-fit: cover;
    }

    .song-info {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .song-title {
        font-size: 16px;
        color: var(--text-primary);
    }

    .song-artist {
        font-size: 14px;
        color: var(--text-secondary);
    }

    .song-options {
        color: var(--text-secondary);
        font-size: 18px;
        padding: 8px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .song-options:hover {
        background-color: #e8e8ed;
        color: var(--accent);
    }

    /* Notification Banner instead of wiping the screen */
    .notification {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        display: none;
    }
    
    .notification.error {
        background-color: #ffe5e5;
        color: #d8000c;
        display: block;
    }
    
    .notification.info {
        background-color: #e5f2ff;
        color: #00529b;
        display: block;
    }

    .lyrics-panel {
        margin-top: 10px;
        padding: 15px;
        background-color: var(--hover-bg);
        border-radius: 8px;
        display: none;
        white-space: pre-wrap;
        font-size: 14px;
        color: var(--text-secondary);
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="header">Library</div>
        <div class="tabs">
            <div class="tab active" onclick="loadMusic('/api/library')">All Songs</div>
            <!-- Example hardcoded playlist fetch. Replace ID with an actual UUID from your database later -->
            <div class="tab" onclick="loadMusic('/api/playlists/YOUR-PLAYLIST-UUID/tracks')">Playlist 1</div>
        </div>
    </div>
    
    <div id="notification-banner" class="notification"></div>
    <div id="song-container" class="song-list"></div>
</div>

<script>
    const API_BASE = 'https://music-backend-production-10bd.up.railway.app'; 

    function showNotification(message, type = 'info') {
        const banner = document.getElementById('notification-banner');
        banner.textContent = message;
        banner.className = `notification ${type}`;
    }

    function hideNotification() {
        document.getElementById('notification-banner').style.display = 'none';
    }

    async function loadMusic(endpoint) {
        const container = document.getElementById('song-container');
        container.innerHTML = ''; // Clear current tracks
        hideNotification();
        
        try {
            const response = await fetch(`${API_BASE}${endpoint}`);
            if (!response.ok) throw new Error(`Status: ${response.status}`);
            
            const data = await response.json();
            const songs = data.tracks; 
            
            if (!songs || songs.length === 0) {
                showNotification('Your library is currently empty.', 'info');
                return;
            }

            songs.forEach(song => {
                const songWrapper = document.createElement('div');
                
                const songDiv = document.createElement('div');
                songDiv.className = 'song-item';
                
                const coverSrc = song.artwork || 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=='; 
                
                songDiv.innerHTML = `
                    <img src="${coverSrc}" class="album-art">
                    <div class="song-info">
                        <div class="song-title">${song.title || song.filename || 'Unknown Title'}</div>
                        <div class="song-artist">${song.artist || 'Unknown Artist'}</div>
                    </div>
                    <div class="song-options" title="Fetch Lyrics">...</div>
                `;
                
                const lyricsPanel = document.createElement('div');
                lyricsPanel.className = 'lyrics-panel';
                
                // Functional Lyrics Fetcher
                const optionsBtn = songDiv.querySelector('.song-options');
                optionsBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    
                    if (lyricsPanel.style.display === 'block') {
                        lyricsPanel.style.display = 'none';
                        return;
                    }

                    lyricsPanel.style.display = 'block';
                    lyricsPanel.textContent = 'Loading lyrics from am-lyrics...';

                    try {
                        const lyricRes = await fetch(`${API_BASE}/api/lyrics?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}`);
                        const lyricData = await lyricRes.json();
                        
                        if (lyricRes.ok) {
                            lyricsPanel.textContent = lyricData.lyrics;
                        } else {
                            lyricsPanel.textContent = "Lyrics not found in repository.";
                        }
                    } catch (err) {
                        lyricsPanel.textContent = "Failed to fetch lyrics.";
                    }
                });

                // Play logic placeholder
                songDiv.addEventListener('click', () => {
                    console.log('Playing:', song.url); 
                });

                songWrapper.appendChild(songDiv);
                songWrapper.appendChild(lyricsPanel);
                container.appendChild(songWrapper);
            });
            
        } catch (error) {
            console.error(error);
            showNotification('Could not connect to the backend. UI structure preserved.', 'error');
        }
    }

    // Load main library on startup
    document.addEventListener('DOMContentLoaded', () => loadMusic('/api/library'));
</script>
</body>
</html>
