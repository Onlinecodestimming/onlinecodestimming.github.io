<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow"></div>
    <div class="app">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <a href="#" class="brand">
                <b>♪</b>
                <span>Music</span>
            </a>
            <div class="sidebar-search">
                <label>
                    <span>🔍</span>
                    <input type="text" placeholder="Search songs, artists..." id="search-input">
                </label>
            </div>
            <nav>
                <div class="nav-section">
                    <div class="nav-section-title">Menu</div>
                    <button class="nav active" onclick="loadRecommended()">
                        <span>🏠</span> Home
                    </button>
                    <button class="nav" onclick="loadLibrary()">
                        <span>📚</span> Library
                    </button>
                    <button class="nav" onclick="loadRecent()">
                        <span>⏱️</span> Recently Played
                    </button>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Playlists</div>
                    <div id="playlist-nav">
                        <!-- Playlists injected here -->
                    </div>
                    <button class="nav" onclick="showCreatePlaylistModal()">
                        <span>➕</span> New Playlist
                    </button>
                </div>
            </nav>
            <div class="sidebar-footer">
                <strong>Music Backend</strong>
                <span id="connection-status">Connected ✓</span>
                <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">🌙</button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main>
            <!-- Recommended/Home Page -->
            <div id="recommended-page" class="page active">
                <h1>Recommended For You</h1>
                <div id="notification-banner" class="notification"></div>
                
                <h2>Featured Playlists</h2>
                <div id="featured-playlists" class="grid">
                    <!-- Featured playlists -->
                </div>

                <h2>New Releases</h2>
                <div id="new-releases" class="list">
                    <!-- New releases -->
                </div>
            </div>

            <!-- Library Page -->
            <div id="library-page" class="page">
                <h1>Your Library</h1>
                <div id="notification-banner2" class="notification"></div>
                <div id="track-list" class="list">
                    <!-- Tracks injected here -->
                </div>
            </div>

            <!-- Recently Played Page -->
            <div id="recent-page" class="page">
                <h1>Recently Played</h1>
                <div id="recent-list" class="list">
                    <!-- Recently played tracks -->
                </div>
            </div>

            <!-- Playlist Detail Page -->
            <div id="playlist-detail-page" class="page">
                <div id="playlist-header">
                    <!-- Playlist header injected -->
                </div>
                <div id="playlist-tracks" class="list">
                    <!-- Playlist tracks -->
                </div>
            </div>

            <!-- Artist Page -->
            <div id="artist-page" class="page">
                <div id="artist-header">
                    <!-- Artist header injected -->
                </div>
                <h2>Popular Tracks</h2>
                <div id="artist-tracks" class="list">
                    <!-- Artist tracks -->
                </div>
            </div>

            <!-- Album Page -->
            <div id="album-page" class="page">
                <div id="album-header">
                    <!-- Album header injected -->
                </div>
                <div id="album-tracks" class="list">
                    <!-- Album tracks -->
                </div>
            </div>

            <!-- Search Results Page -->
            <div id="search-page" class="page">
                <h1 id="search-title">Search Results</h1>
                <div id="search-results" class="list">
                    <!-- Search results injected -->
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Persistent Player -->
    <div class="player">
        <div class="now-playing">
            <img id="now-playing-art" src="data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==" alt="Album Art">
            <div class="song">
                <strong id="now-playing-title">Not Playing</strong>
                <span id="now-playing-artist">--</span>
            </div>
        </div>

        <div class="center">
            <div class="controls">
                <button id="btn-prev">⏮️</button>
                <button id="btn-play" class="main">▶️</button>
                <button id="btn-next">⏭️</button>
            </div>
            <div class="progress">
                <span id="current-time">0:00</span>
                <input id="progress-bar" type="range" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-actions">
            <button id="btn-heart" class="heart">🤍</button>
            <div style="display: flex; gap: 8px; align-items: center;">
                <label>🔊</label>
                <input id="volume-control" type="range" min="0" max="100" value="70">
            </div>
            <button id="btn-lyrics">📝</button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player"></audio>

    <!-- Lyrics Modal -->
    <div id="lyrics-overlay" class="lyrics-container">
        <div class="lyrics-content">
            <button class="close-lyrics">✕</button>
            <h2 id="lyrics-title">Lyrics</h2>
            <div id="lyrics-text" class="lyrics-text">Loading lyrics...</div>
        </div>
    </div>

    <!-- Create Playlist Modal -->
    <div id="create-playlist-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Create New Playlist</h2>
            <input type="text" id="playlist-name-input" placeholder="Playlist name" class="modal-input">
            <textarea id="playlist-description-input" placeholder="Description (optional)" class="modal-input"></textarea>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeCreatePlaylistModal()">Cancel</button>
                <button class="modal-btn" onclick="createPlaylist()">Create</button>
            </div>
        </div>
    </div>

    <!-- Add to Playlist Modal -->
    <div id="add-to-playlist-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Add to Playlist</h2>
            <div id="playlists-list" class="playlists-list">
                <!-- Playlists -->
            </div>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeAddToPlaylistModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
